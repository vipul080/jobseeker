spring.application.name=jobseeker

# File-based H2 so your data survives restarts (stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/jobseeker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Keep ;jsessionid out of redirect URLs
server.servlet.session.tracking-modes=cookie

# Fingerprint static files (style-<hash>.css) so browsers pick up CSS changes
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
