<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${job.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('jobs')}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <a class="back" th:href="@{/jobs}">← All jobs</a>
    <div class="detail-grid">
        <section class="card">
            <div class="detail-head">
                <div th:replace="~{fragments/layout :: logo(${job}, 'logo logo-lg')}"></div>
                <div class="grow">
                    <h1 th:text="${job.title}"></h1>
                    <div class="muted" th:text="${job.company} + ' · ' + ${job.location}"></div>
                </div>
                <form th:action="@{/jobs/{id}/save(id=${job.id})}" method="post">
                    <button class="btn btn-ghost" type="submit" th:text="${job.saved} ? '★ Saved' : '☆ Save'"></button>
                </form>
            </div>
            <div class="tags">
                <span class="tag" th:text="${job.type.label}"></span>
                <span class="tag tag-green" th:if="${job.remote}">Remote</span>
                <span class="tag tag-plain" th:text="${job.salaryRange}"></span>
                <span class="tag tag-plain" th:text="'Posted ' + ${#temporals.format(job.postedOn, 'd MMM yyyy')}"></span>
            </div>
            <h2>About the role</h2>
            <div class="description rich" th:if="${job.descriptionHtml}" th:utext="${job.descriptionHtml}"></div>
            <p class="description" th:unless="${job.descriptionHtml}" th:text="${job.description}"></p>
            <p class="attribution" th:if="${job.external}">
                Listing from <a th:href="${job.applyUrl}" target="_blank" rel="noopener" th:text="${job.source}"></a>.
                <a th:href="${job.applyUrl}" target="_blank" rel="noopener">View the original posting ↗</a>
            </p>
        </section>

        <section class="card" th:if="${job.external}">
            <h2>Apply</h2>
            <p class="muted">This job is listed on <strong th:text="${job.source}"></strong>. Apply on their site, then mark it as applied here to track it.</p>
            <div class="form">
                <a class="btn center" th:href="${job.applyUrl}" target="_blank" rel="noopener"
                   th:text="'Apply on ' + ${job.source} + ' ↗'"></a>
                <p class="notice" th:if="${alreadyApplied}">
                    You're tracking this one. <a th:href="@{/applications}">View it</a>
                </p>
                <form th:unless="${alreadyApplied}" th:action="@{/jobs/{id}/track(id=${job.id})}" method="post">
                    <button class="btn btn-ghost full" type="submit">✓ Mark as applied</button>
                </form>
            </div>
        </section>

        <section class="card" th:unless="${job.external}">
            <h2>Apply</h2>
            <p class="notice" th:if="${alreadyApplied}">
                You've already applied here. <a th:href="@{/applications}">Track it</a>
            </p>
            <form th:action="@{/jobs/{id}/apply(id=${job.id})}" th:object="${application}" method="post" class="form">
                <label>Full name *
                    <input th:field="*{fullName}" required>
                    <span class="error" th:errors="*{fullName}"></span>
                </label>
                <label>Email *
                    <input type="email" th:field="*{email}" required>
                    <span class="error" th:errors="*{email}"></span>
                </label>
                <label>Phone
                    <input type="tel" th:field="*{phone}">
                </label>
                <label>Résumé link
                    <input type="url" th:field="*{resumeLink}" placeholder="https://drive.google.com/…">
                </label>
                <label>Cover letter
                    <textarea th:field="*{coverLetter}" rows="6" placeholder="Why you're a great fit"></textarea>
                </label>
                <button class="btn" type="submit">Submit application</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
